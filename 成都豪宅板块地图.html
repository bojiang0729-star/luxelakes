<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="从金融城到麓湖，探索成都代表性高端住区与湖区组团，支持地图、卫星、搜索、分类与排序">
  <title>成都豪宅核心板块地图 | 楼盘明细</title>
  <link rel="stylesheet" href="leaflet.min.css">
  <style>
    :root {
      color-scheme: light;
      --color-ink: #13201f;
      --color-ink-soft: #3f4d4b;
      --color-paper: #f3f0e8;
      --color-paper-deep: #e5e1d6;
      --color-surface: #faf8f2;
      --color-lake: #39bda2;
      --color-lake-deep: #087b68;
      --color-focus: #087b68;
      --color-gold: #b99a5a;
      --color-line: rgb(19 32 31 / 16%);
      --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      --font-display: "Microsoft YaHei UI", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --duration-fast: 220ms;
      --header-height: 64px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-inline-size: 320px; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-block-size: 100dvh;
      color: var(--color-ink);
      background: #14201f;
      font-family: var(--font-sans);
      font-size: 1rem;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration-thickness: .08em; text-underline-offset: .2em; }
    h1, h2, h3 { max-inline-size: 18ch; margin-block: 0 .65em; font-family: var(--font-display); font-weight: 600; line-height: 1.12; letter-spacing: -.035em; }
    h1 { font-size: clamp(1.55rem, 2.2vw, 2rem); }
    h2 { font-size: 1.35rem; }
    :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 4px; }
    .sr-only {
      position: absolute; inline-size: 1px; block-size: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .skip-link {
      position: fixed; inset-block-start: 1rem; inset-inline-start: 1rem; z-index: 1300;
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 44px; min-height: 44px; padding-inline: 1rem;
      color: var(--color-paper); background: var(--color-ink);
      border-radius: .35rem; transform: translateY(calc(-100% - 3rem));
      transition: transform var(--duration-fast) var(--ease-out);
    }
    .skip-link:focus-visible { transform: translateY(0); }

    .map-page { overflow: hidden; color: #17211f; background: #14201f; }

    .map-brandbar {
      position: fixed; z-index: 1200; inset: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      min-block-size: var(--header-height); padding-inline: 20px;
      color: #f4f0e7; background: rgb(16 29 27 / 92%);
      border-block-end: 1px solid rgb(244 240 231 / 16%);
      backdrop-filter: blur(12px);
    }
    .map-brandbar__brand, .map-brandbar__nav a {
      display: inline-flex; align-items: center; min-block-size: 44px;
      color: inherit; text-decoration: none;
    }
    .map-brandbar__brand { gap: 12px; }
    .map-brandbar__brand strong { font-family: var(--font-display); font-size: 1.1rem; letter-spacing: .06em; }
    .map-brandbar__brand span { padding-inline-start: 12px; color: rgb(244 240 231 / 68%); border-inline-start: 1px solid #9faf87; font-size: .72rem; letter-spacing: .12em; }
    .map-brandbar__nav { display: flex; align-items: center; gap: 4px; }
    .map-brandbar__nav a { padding-inline: 10px; color: rgb(244 240 231 / 76%); font-size: .78rem; letter-spacing: .08em; }
    .map-brandbar__nav a[aria-current="page"], .map-brandbar__nav a:hover { color: #f4f0e7; }

    .map-shell {
      position: relative; inline-size: 100%; block-size: 100dvh; min-block-size: 100dvh;
      padding: 0; overflow: hidden;
      background: radial-gradient(circle at 72% 40%, rgb(79 120 105 / 32%), transparent 34%), #14201f;
    }
    #property-map { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; background: transparent; }
    #property-map .leaflet-tile-pane {
      background: #e9e6dc;
      filter: saturate(.58) sepia(.08) contrast(.95) brightness(.92);
    }
    [data-map-mode="satellite"] #property-map .leaflet-tile-pane { filter: saturate(.92) contrast(1.04) brightness(.94); }
    #property-map .leaflet-control-attribution {
      margin: 0 8px 8px 0; padding: 3px 7px; color: #33413f;
      background: rgb(246 243 235 / 86%); font-size: 10px;
    }
    #property-map .leaflet-control-zoom {
      overflow: hidden; background: rgb(16 29 27 / 92%);
      border: 1px solid rgb(244 240 231 / 18%); border-radius: 9px;
      box-shadow: 0 10px 28px rgb(7 17 15 / 24%);
    }
    #property-map .leaflet-control-zoom a {
      inline-size: 44px; block-size: 44px; color: #f4f0e7;
      background: transparent; border-block-end-color: rgb(244 240 231 / 14%); line-height: 44px;
    }
    #property-map .leaflet-control-zoom a:hover, #property-map .leaflet-control-zoom a:focus-visible {
      color: #182522; background: #f2eee4;
    }

    .map-mode-switch {
      position: absolute; z-index: 1120; inset: 84px 20px auto auto;
      display: none; gap: 3px; padding: 4px; color: #f4f0e7;
      background: rgb(16 29 27 / 92%); border: 1px solid rgb(244 240 231 / 18%);
      border-radius: 11px; box-shadow: 0 12px 34px rgb(7 17 15 / 24%);
      backdrop-filter: blur(12px);
    }
    .is-map-enhanced .map-mode-switch { display: flex; }
    .map-mode-switch button {
      min-inline-size: 64px; min-block-size: 44px; padding-inline: 14px;
      color: rgb(244 240 231 / 72%); background: transparent; border: 0; border-radius: 7px;
      font-size: .76rem; font-weight: 650; letter-spacing: .06em;
      transition: transform var(--duration-fast) var(--ease-out), opacity var(--duration-fast) var(--ease-out);
    }
    .map-mode-switch button:hover { opacity: .86; }
    .map-mode-switch button:active { transform: scale(.97); }
    .map-mode-switch button[aria-pressed="true"] {
      color: #182522; background: #f2eee4; box-shadow: inset 0 0 0 1px rgb(23 33 31 / 10%);
    }

    /* ===== 地图筛选工具栏 ===== */
    .map-filter {
      position: absolute; z-index: 1120; inset: 140px 20px auto auto;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    }
    .map-filter[hidden] { display: none; }
    .map-filter__toggle {
      display: inline-flex; align-items: center; gap: 7px;
      min-block-size: 44px; padding-inline: 15px;
      color: #f4f0e7; background: rgb(16 29 27 / 92%);
      border: 1px solid rgb(244 240 231 / 18%); border-radius: 11px;
      box-shadow: 0 12px 34px rgb(7 17 15 / 24%);
      backdrop-filter: blur(12px); cursor: pointer;
      font-size: .78rem; font-weight: 650; letter-spacing: .06em;
      transition: transform var(--duration-fast) var(--ease-out), opacity var(--duration-fast) var(--ease-out);
    }
    .map-filter__toggle:hover { opacity: .9; }
    .map-filter__toggle:active { transform: scale(.97); }
    .map-filter__icon { inline-size: 15px; block-size: 15px; opacity: .8; }
    .map-filter__badge {
      display: grid; place-items: center; min-inline-size: 20px; block-size: 20px;
      padding-inline: 5px; color: #203632; background: #b7c3a2;
      border-radius: 999px; font-size: .68rem; font-weight: 700;
    }
    .map-filter__badge[hidden] { display: none; }
    .map-filter__panel {
      inline-size: min(340px, calc(100vw - 40px)); padding: 16px;
      color: #f4f0e7; background: rgb(16 29 27 / 94%);
      border: 1px solid rgb(244 240 231 / 16%); border-radius: 12px;
      box-shadow: 0 20px 50px rgb(7 17 15 / 32%);
      backdrop-filter: blur(14px);
      transform-origin: top right;
      animation: map-filter-in var(--duration-fast) var(--ease-out);
    }
    .map-filter__panel[hidden] { display: none; }
    @keyframes map-filter-in {
      from { opacity: 0; transform: translateY(-6px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .map-filter__heading {
      display: flex; align-items: center; justify-content: space-between; margin-block-end: 12px;
    }
    .map-filter__heading strong { font-size: .82rem; letter-spacing: .06em; }
    .map-filter__heading button {
      min-block-size: 34px; padding-inline: 10px; color: rgb(244 240 231 / 76%);
      background: transparent; border: 1px solid rgb(244 240 231 / 18%);
      border-radius: 7px; font-size: .7rem; cursor: pointer;
      transition: opacity var(--duration-fast) var(--ease-out);
    }
    .map-filter__heading button:hover { opacity: .85; }
    .map-filter__search { display: grid; gap: 5px; margin-block-end: 12px; }
    .map-filter__search span, .map-filter__field span {
      color: rgb(244 240 231 / 64%); font-size: .68rem; font-weight: 650; letter-spacing: .05em;
    }
    .map-filter__search input, .map-filter__field select {
      min-block-size: 40px; padding-inline: 11px;
      color: #f4f0e7; background: rgb(244 240 231 / 8%);
      border: 1px solid rgb(244 240 231 / 18%); border-radius: 7px;
      outline: 0; font-size: .76rem;
    }
    .map-filter__search input::placeholder { color: rgb(244 240 231 / 42%); }
    .map-filter__search input:focus, .map-filter__field select:focus {
      border-color: #9faf87; outline: 2px solid rgb(159 175 135 / 30%); outline-offset: 1px;
    }
    .map-filter__search input {
      inline-size: 100%; min-block-size: 44px;
    }
    .map-filter__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .map-filter__field { display: grid; gap: 5px; }
    .map-filter__field select { inline-size: 100%; cursor: pointer; }
    .map-filter__field select option { color: #17211f; background: #f5f1e7; }

    @media (max-width: 759px) {
      .map-filter { inset: 116px 12px auto auto; }
      .map-filter__toggle { padding-inline: 12px; }
      .map-filter__panel { inline-size: min(320px, calc(100vw - 24px)); }
    }

    .map-panel {
      position: absolute; z-index: 1100; inset: 84px auto 20px 20px;
      inline-size: min(370px, calc(100% - 40px)); padding: 24px 22px 20px;
      overflow: auto; overscroll-behavior: contain;
      color: #17211f; background: #f5f1e7;
      border: 1px solid rgb(255 255 255 / 50%); border-radius: 12px;
      box-shadow: 0 22px 70px rgb(9 20 18 / 28%);
      scrollbar-color: #86938b transparent; scrollbar-width: thin;
    }
    .map-panel__handle, .map-panel__close, .map-drawer-toggle { display: none; }
    .map-panel__header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
      padding-block-end: 18px; border-block-end: 1px solid rgb(23 33 31 / 14%);
    }
    .map-panel__header h1 { margin: 0; font-weight: 560; line-height: 1.12; }
    .map-kicker { margin-block: 0 7px; color: #567065; font-size: .68rem; font-weight: 700; letter-spacing: .13em; }

    .map-search { margin-block: 20px 16px; }
    .map-search label { display: block; margin-block-end: 7px; color: #465450; font-size: .74rem; font-weight: 650; letter-spacing: .05em; }
    .map-search__field {
      display: grid; grid-template-columns: minmax(0, 1fr) auto;
      border: 1px solid rgb(23 33 31 / 24%); border-radius: 7px; background: #fffdf8;
    }
    .map-search input { min-inline-size: 0; min-block-size: 46px; padding: 0 13px; color: #17211f; background: transparent; border: 0; outline: 0; }
    .map-search input::placeholder { color: #78827e; }
    .map-search__field:focus-within { outline: 2px solid var(--color-focus); outline-offset: 2px; }
    .map-search button { min-inline-size: 54px; min-block-size: 44px; padding-inline: 10px; color: #496059; background: transparent; border: 0; font-size: .75rem; }

    .map-districts {
      display: flex; gap: 7px; padding-block-end: 4px; overflow-x: auto; scrollbar-width: none;
    }
    .map-districts::-webkit-scrollbar { display: none; }
    .map-districts button {
      flex: none; min-block-size: 44px; padding-inline: 13px;
      color: #4f5d59; background: transparent; border: 1px solid rgb(23 33 31 / 18%);
      border-radius: 999px; font-size: .74rem;
      transition: transform var(--duration-fast) var(--ease-out), opacity var(--duration-fast) var(--ease-out);
    }
    .map-districts button:hover { transform: translateY(-1px); }
    .map-districts button[aria-pressed="true"] { color: #f6f2e8; background: #203632; border-color: #203632; }

    .map-sort {
      display: flex; align-items: center; gap: 10px; margin-block: 14px 0;
    }
    .map-sort label { flex: none; color: #465450; font-size: .74rem; font-weight: 650; letter-spacing: .05em; }
    .map-sort select {
      flex: 1; min-inline-size: 0; min-block-size: 44px; padding-inline: 12px;
      color: #17211f; background: #fffdf8; border: 1px solid rgb(23 33 31 / 24%);
      border-radius: 7px; outline: 0; font-size: .78rem; cursor: pointer;
    }
    .map-sort select:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

    .map-panel__meta {
      display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 12px;
      margin-block: 13px 14px;
    }
    .map-panel__meta p { margin: 0; }
    .map-panel__meta > p:first-child { color: #273733; font-size: .78rem; white-space: nowrap; }
    .map-panel__meta [data-map-status] { color: #67736f; font-size: .68rem; line-height: 1.45; text-align: end; }

    .property-detail {
      position: relative; padding: 18px; color: #f5f1e7; background: #223733;
      border-radius: 8px; box-shadow: inset 0 1px 0 rgb(255 255 255 / 10%);
    }
    .property-detail::before {
      position: absolute; inset: 0 auto 0 0; inline-size: 3px; content: "";
      background: #9faf87;
    }
    .property-detail h2 { margin-block: 3px 7px; font-weight: 560; }
    .property-detail p { margin-block: 0 8px; color: rgb(245 241 231 / 76%); font-size: .78rem; line-height: 1.55; }
    .property-detail__district { color: #bdc9a8 !important; font-size: .66rem !important; font-weight: 700; letter-spacing: .1em; }
    .property-detail__meta { color: rgb(245 241 231 / 56%) !important; }
    .property-detail__row b { color: #dce4d4; font-weight: 650; }
    .property-detail__tags { display: flex; flex-wrap: wrap; gap: 5px; margin-block-start: 6px; }
    .property-detail__tag {
      display: inline-block; padding: 2px 9px; color: #d8e0cd; background: rgb(255 255 255 / 8%);
      border: 1px solid rgb(255 255 255 / 12%); border-radius: 999px; font-size: .64rem;
    }
    .property-detail__price { color: #f0c46a !important; font-size: .95rem !important; font-weight: 700; }
    .property-detail__link {
      display: inline-flex; align-items: center; min-block-size: 44px; margin-block-start: 3px;
      color: #f5f1e7; font-size: .78rem; font-weight: 650; text-decoration-color: #9faf87;
    }

    .property-list { display: grid; gap: 0; padding: 0; margin: 13px 0 0; list-style: none; }

    .property-list__item { position: relative; border-block-end: 1px solid rgb(23 33 31 / 12%); }
    .property-list__item .property-detail {
      margin: 2px 10px 14px 4px;
      transition: transform var(--duration-fast) var(--ease-out), opacity var(--duration-fast) var(--ease-out);
    }

    /* 选中楼盘：标题行 + 详情卡在视觉上融合成一张完整的深色卡片 */
    .property-list__item.is-selected {
      margin-block: 5px 0;
      color: #f5f1e7;
      background: #223733;
      border-block-end: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 10%);
    }
    .property-list__item.is-selected::before {
      position: absolute; inset: 0 auto 0 0; inline-size: 3px; content: "";
      background: #9faf87;
    }
    .property-list__item.is-selected .property-list__button,
    .property-list__item.is-selected > a {
      color: #f5f1e7; background: transparent; border-radius: 12px 12px 0 0;
    }
    .property-list__item.is-selected .property-list__button::before { display: none; }
    .property-list__item.is-selected .property-list__button::after,
    .property-list__item.is-selected > a::after { color: #f5f1e7; opacity: .6; }
    .property-list__item.is-selected .property-list__button strong,
    .property-list__item.is-selected > a strong { color: #f5f1e7; }
    .property-list__item.is-selected .property-list__button span,
    .property-list__item.is-selected > a span { color: rgb(245 241 231 / 62%); }
    .property-list__item.is-selected .property-detail {
      margin: 0 10px 12px 4px; border-radius: 0 0 12px 12px;
      background: transparent; box-shadow: none;
    }
    .property-list__item.is-selected .property-detail::before { display: none; }
    .property-list__item.is-selected .property-detail.is-in {
      animation: property-detail-in var(--duration-fast) var(--ease-out);
    }
    @keyframes property-detail-in {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .property-list__button, .property-list > li > a {
      position: relative; display: grid; inline-size: 100%; min-block-size: 58px;
      padding: 10px 28px 10px 4px; color: #263531; background: transparent;
      border: 0; text-align: start; text-decoration: none;
      transition: background-color var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
    }
    .property-list__button:hover, .property-list > li > a:hover { background: rgb(23 33 31 / 5%); }
    .property-list__button::after, .property-list > li > a::after {
      position: absolute; inset: 50% 5px auto auto; inline-size: 7px; block-size: 7px;
      content: ""; border-block-start: 1px solid currentColor; border-inline-end: 1px solid currentColor;
      opacity: .45; transform: translateY(-50%) rotate(45deg);
    }
    .property-list__button strong, .property-list > li > a strong { font-size: .84rem; font-weight: 650; }
    .property-list__button span, .property-list > li > a span { color: #6c7874; font-size: .68rem; }
    .property-list__button[aria-current="true"] { color: #0d6d5c; }
    .property-list__button[aria-current="true"]::before {
      position: absolute; inset: 12px auto 12px -10px; inline-size: 2px; content: ""; background: #0d6d5c;
    }

    .property-marker {
      display: block !important; background: transparent; border: 0;
      /* 命中区由 JS 的 iconSize 放大到 44×44；这里去掉移动端点按延迟与高亮块 */
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .property-marker__pin {
      position: absolute; inset-block-end: 0; inset-inline-start: 50%;
      display: grid; inline-size: 20px; block-size: 20px; place-items: center;
      color: #31433f; background: currentcolor; border: 2px solid #f4f0e7;
      border-radius: 50% 50% 50% 0; box-shadow: 0 5px 8px rgb(10 24 21 / 28%);
      transform: rotate(-45deg); transform-origin: 0 100%;
    }
    .property-marker__dot { display: block; inline-size: 7px; block-size: 7px; background: #f4f0e7; border-radius: 50%; }
    .property-marker--lake .property-marker__pin { color: #207f6d; }
    .property-marker--featured .property-marker__pin { inline-size: 26px; block-size: 26px; color: #a98445; }
    .property-marker--featured .property-marker__dot { inline-size: 9px; block-size: 9px; }
    .property-marker.is-active .property-marker__pin {
      transform: rotate(-45deg) scale(1.35);
      box-shadow: 0 0 0 3px #f6f2e8, 0 0 0 6px rgb(13 109 92 / 42%), 0 10px 18px rgb(10 24 21 / 40%);
    }
    .property-marker.is-active .property-marker__dot { background: #f6f2e8; }
    /* 选中针头底部的扩散脉冲光圈，让选中位置在地图上更醒目 */
    .property-marker.is-active::before {
      position: absolute; inset-block-end: 0; inset-inline-start: 50%;
      inline-size: 16px; block-size: 16px; content: "";
      background: #0d6d5c; border-radius: 50%;
      opacity: .5; transform: translate(-50%, 50%) scale(.9);
      animation: marker-pulse 1.7s var(--ease-out) infinite;
      pointer-events: none;
    }
    @keyframes marker-pulse {
      0%   { opacity: .5; transform: translate(-50%, 50%) scale(.9); }
      70%  { opacity: 0;  transform: translate(-50%, 50%) scale(3); }
      100% { opacity: 0;  transform: translate(-50%, 50%) scale(3); }
    }

    /* ===== 3D 楼栋查看器（ARCANE RISE · 4栋）===== */
    .tower-viewer {
      position: fixed; z-index: 3000; inset: 0;
      display: flex; flex-direction: column;
      color: #f4f0e7;
      background: radial-gradient(120% 90% at 50% 8%, rgb(31 44 42 / 96%), rgb(9 16 15 / 98%));
      backdrop-filter: blur(6px);
      animation: tower-in .35s var(--ease-out);
    }
    .tower-viewer[hidden] { display: none; }
    .tower-viewer__top {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 15px 20px; border-block-end: 1px solid rgb(244 240 231 / 12%);
      background: rgb(12 21 20 / 70%);
    }
    .tower-viewer__title { display: grid; gap: 2px; }
    .tower-viewer__title strong { font-size: 1.12rem; letter-spacing: .04em; }
    .tower-viewer__title span { font-size: .76rem; color: rgb(244 240 231 / 70%); }
    .tower-viewer__close {
      min-block-size: 40px; padding-inline: 16px; cursor: pointer;
      color: #f4f0e7; background: rgb(244 240 231 / 10%);
      border: 1px solid rgb(244 240 231 / 20%); border-radius: 8px; font-weight: 650;
      font-family: var(--font-sans);
    }
    .tower-viewer__close:hover { background: rgb(244 240 231 / 18%); }
    .tower-viewer__stage { position: relative; flex: 1; min-block-size: 0; }
    #tower-canvas { display: block; inline-size: 100%; block-size: 100%; outline: 0; touch-action: none; }
    .tower-viewer__hint {
      position: absolute; inset-inline: 0; inset-block-end: 14px; z-index: 2;
      text-align: center; font-size: .76rem; color: rgb(244 240 231 / 62%);
      pointer-events: none; letter-spacing: .04em;
    }

/* ===== 价格区间解析（用于地图筛选） ===== */
/* 单价：'5-8万/㎡' → [5, 8]；'3.5-5.5万/㎡' → [3.5, 5.5]；'待定' → null */
const parsePriceRange = (str) => {
  const m = String(str || '').match(/(\d+(?:\.\d+)?)\s*[-~至]\s*(\d+(?:\.\d+)?)/);
  return m ? [Number(m[1]), Number(m[2])] : null;
};
/* 面积字符串：'130-140㎡' → [130, 140]；'约220㎡' → [220, 220]；未知 → null */
const parseAreaFromString = (raw) => {
  const text = String(raw || '');
  const ranged = text.match(/(\d+(?:\.\d+)?)\s*[-~至]\s*(\d+(?:\.\d+)?)\s*㎡/);
  if (ranged) return [Number(ranged[1]), Number(ranged[2])];
  const single = text.match(/(\d+(?:\.\d+)?)\s*㎡/);
  return single ? [Number(single[1]), Number(single[1])] : null;
};
/* 面积：'160-350㎡' → [160, 350]；从 hx 户型列表汇总；未知 → null */
const parseAreaRange = (info) => {
  if (info.s) {
    const direct = parseAreaFromString(info.s);
    if (direct) return direct;
  }
  if (typeof info.hx === 'string') return parseAreaFromString(info.hx);
  if (Array.isArray(info.hx)) {
    let min = Infinity, max = 0;
    info.hx.forEach((h) => {
      const r = parseAreaFromString(h && h.s);
      if (r) { min = Math.min(min, r[0]); max = Math.max(max, r[1]); }
    });
    return min === Infinity ? null : [min, max];
  }
  return null;
};
/* 户型级总价区间：每个户型的总价 = 户型面积区间 × 整盘单价区间；
   如浔岭 A1(130-140㎡, 单价 4-7万) → [520, 980] 万；F(约220㎡) → [880, 1540] 万 */
const computeUnitTotals = (info, unitRange) => {
  if (!unitRange) return null;
  const totals = [];
  const push = (area) => {
    if (!area) return;
    totals.push([Number((area[0] * unitRange[0]).toFixed(1)), Number((area[1] * unitRange[1]).toFixed(1))]);
  };
  if (info.s) push(parseAreaFromString(info.s));
  if (Array.isArray(info.hx)) info.hx.forEach((h) => push(parseAreaFromString(h && h.s)));
  else if (typeof info.hx === 'string') push(parseAreaFromString(info.hx));
  return totals.length ? totals : null;
};

/* ===== 归一化楼盘记录 ===== */
const slugify = (name) => 'p-' + name.replace(/[()（）]/g, '').replace(/\s+/g, '-');
const statusOf = (name, info) => {
  if (name.includes('(在建)') || name.includes('在建')) return '在建';
  if (name.startsWith('C') && info.ft && info.ft.includes('规划')) return '规划中';
  if (info.ft && (info.ft.includes('规划') || info.ft.includes('待交付'))) return '规划中';
  return '已呈现';
};
const PROPERTIES = [];
const AREA_ORDER = [];
DISTRICTS.forEach((district) => {
  AREA_ORDER.push(district.area);
  district.devs.forEach((dev) => {
    const unit = parsePriceRange(dev.info && dev.info.p);
    const area = parseAreaRange(dev.info);
    const total = unit && area ? [Number((unit[0] * area[0]).toFixed(1)), Number((unit[1] * area[1]).toFixed(1))] : null;
    const unitTotals = computeUnitTotals(dev.info, unit);
    PROPERTIES.push({
      id: slugify(dev.nm),
      name: dev.nm,
      district: district.area,
      sourceCoordinates: dev.c,
      coordinates: gcj02ToWgs84(dev.c),
      status: statusOf(dev.nm, dev.info),
      category: dev.info.t,
      summary: dev.info.ft || dev.info.a || '',
      detailPath: dev.info.detailUrl || (dev.nm === '浔岭' ? '浔岭/浔岭.html' : (dev.nm === '沉香谷' ? '沉香谷/沉香谷.html' : null)),
      featured: dev.nm === '沉香谷' || dev.nm === '浔岭' || dev.nm === '鸿屿长洲',
      info: dev.info,

    list.addEventListener('mouseover', handleListHover);
    list.addEventListener('mouseleave', handleListLeave);
  }
  if (clear) clear.addEventListener('click', handleClear);
  if (form) form.addEventListener('submit', handleSubmit);
  if (modeSwitch) modeSwitch.addEventListener('click', handleMapMode);
  if (sortControl) sortControl.addEventListener('change', handleSort);
  if (drawerToggle) drawerToggle.addEventListener('click', openDrawer);
  if (drawerClose) drawerClose.addEventListener('click', function () { closeDrawer(true); });
  document.addEventListener('keydown', handleKeydown);
  if (mapFilterToggle && mapFilterPanel) mapFilterToggle.addEventListener('click', toggleMapFilter);
  if (mapFilter) mapFilter.addEventListener('change', handleMapFilterChange);
  if (mapSearch) mapSearch.addEventListener('input', handleMapFilterChange);
  if (mapFilterReset) mapFilterReset.addEventListener('click', resetAllFilters);
  populateCategoryOptions();

  setMapMode('map');
  applyFilters({}, { fit: false });
  root.classList.add('is-map-enhanced');

  /* 深链：?tower=1 一键直达「鸿屿长洲」全景大沙盘 */
  if (location.search.indexOf('tower=1') > -1) {
    setMapMode('satellite');
    setTimeout(function () {
      if (typeof openTowerViewer === 'function') openTowerViewer();
    }, 500);
  }
})();
  </script>

  <script>
    /* 移动端折叠导航 */
    (function () {
      var toggle = document.querySelector('[data-map-nav-toggle]');
      var panel = document.querySelector('[data-map-nav-panel]');
      if (!toggle || !panel) return;

      function setOpen(open) {
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) { panel.removeAttribute('hidden'); } else { panel.setAttribute('hidden', ''); }
      }

      setOpen(false);

      toggle.addEventListener('click', function (event) {
        event.stopPropagation();
        setOpen(panel.hasAttribute('hidden'));
      });

      panel.addEventListener('click', function (event) {
        if (event.target.closest('a')) setOpen(false);
      });

      document.addEventListener('click', function (event) {
        if (panel.hasAttribute('hidden')) return;
        if (panel.contains(event.target) || toggle.contains(event.target)) return;
        setOpen(false);
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && !panel.hasAttribute('hidden')) {
          setOpen(false);
          toggle.focus();
        }
      });

      window.addEventListener('resize', function () {
        if (window.innerWidth > 759) setOpen(false);
      });
    })();
  </script>
